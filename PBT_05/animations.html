<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuongVanHung - CSS Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <div class="spinner-container">
        <div class="loading-spinner"></div>
        <p>Loading products...</p>
    </div>

    <main class="product-container fade-in-section">

        <div class="card">
            <div class="img-container">
                <img src="https://picsum.photos/300/200?random=1" alt="Product">
            </div>
            <h3>Product Sample 1</h3>
            <p>$100</p>
            <button class="buy-btn">Mua ngay</button>
        </div>

        <div class="card">
            <div class="img-container">
                <img src="https://picsum.photos/300/200?random=2" alt="Product">
            </div>
            <h3>Product Sample 2</h3>
            <p>$150</p>
            <button class="buy-btn">Mua ngay</button>
        </div>

    </main>

</body>
</html>
