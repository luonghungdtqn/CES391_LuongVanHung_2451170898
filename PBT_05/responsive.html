<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuongVanHung - Responsive Product Page</title>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>

<header class="site-header">
    <div class="logo">LOGO</div>

    <input type="checkbox" id="menu-toggle">
    <label for="menu-toggle" class="hamburger">☰</label>

    <nav class="navigation">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<div class="main-layout">

    <aside class="sidebar">
        <h3>Filters</h3>
        <select>
            <option>Category</option>
            <option>Option 1</option>
            <option>Option 2</option>
        </select>
    </aside>

    <main class="product-grid-container">
        <div class="card">
            <img src="https://picsum.photos/300/200?random=1" alt="Product 1">
            <h3>Product 1</h3>
            <p>$20</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=2" alt="Product 2">
            <h3>Product 2</h3>
            <p>$25</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=3" alt="Product 3">
            <h3>Product 3</h3>
            <p>$30</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=4" alt="Product 4">
            <h3>Product 4</h3>
            <p>$40</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=5" alt="Product 5">
            <h3>Product 5</h3>
            <p>$50</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=6" alt="Product 6">
            <h3>Product 6</h3>
            <p>$60</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=7" alt="Product 7">
            <h3>Product 7</h3>
            <p>$70</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=8" alt="Product 8">
            <h3>Product 8</h3>
            <p>$80</p>
        </div>
    </main>

    <aside class="ads-bar">
        <h3>Ads Bar</h3>
    </aside>

</div>

<footer class="site-footer">
    <p>© 2026 Code by Luong Van Hung</p>
</footer>

</body>
</html>
